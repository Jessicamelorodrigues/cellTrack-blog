<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CellTrack Blog</title>
  <meta name="description" content="News, milestones and science updates from CellTrack." />
  <link rel="icon" type="image/png" href="icon.png" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <style>
    .hero-bg { background: linear-gradient(135deg, #EBF5FB 0%, #F0F7FF 60%, #EBF8FF 100%); }

    .nav-link { position: relative; }
    .nav-link::after {
      content: ''; position: absolute; bottom: -2px; left: 0;
      width: 0; height: 2px; background: #29ABE2; transition: width 0.2s;
    }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #post { animation: fadeInUp 0.7s 0.1s ease both; }

    .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .reveal.visible { opacity: 1; transform: translate(0, 0); }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased">

  <!-- NAV (same as index.html) -->
  <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-slate-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="./"><img src="logo.png" alt="CellTrack" class="h-9" /></a>
      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
        <a href="./#technology" class="nav-link hover:text-[#1B3A6B] transition-colors">Technology</a>
        <a href="./#why" class="nav-link hover:text-[#1B3A6B] transition-colors">Why CellTrack</a>
        <a href="./#team" class="nav-link hover:text-[#1B3A6B] transition-colors">Team</a>
        <a href="blog.html" class="nav-link active text-[#1B3A6B] transition-colors">Blog</a>
        <a href="./#contact" class="bg-[#1B3A6B] text-white px-5 py-2 rounded-lg hover:bg-[#29ABE2] transition-colors">
          Get in Touch
        </a>
      </div>
      <a href="./#contact" class="md:hidden bg-[#1B3A6B] text-white text-sm px-4 py-2 rounded-lg hover:bg-[#29ABE2] transition-colors">
        Contact
      </a>
    </div>
  </nav>

  <!-- POST -->
  <main class="hero-bg px-6 pt-10 pb-20 md:pb-24">
    <div class="max-w-5xl mx-auto">
      <a id="back" href="blog.html" class="inline-block text-sm font-semibold text-[#29ABE2] hover:text-[#1B3A6B] transition-colors mb-10">&larr; All posts</a>
      <article id="post" class="bg-white rounded-3xl border border-slate-100 shadow-sm px-6 py-12 md:px-12 md:py-16"></article>
    </div>
  </main>

  <!-- MORE POSTS -->
  <section id="more" class="hidden py-16 px-6 bg-white">
    <div class="max-w-5xl mx-auto">
      <div class="text-center mb-10">
        <p class="text-[#29ABE2] text-xs font-bold uppercase tracking-widest mb-3">Keep Reading</p>
        <h2 class="text-2xl md:text-3xl font-bold text-[#1B3A6B]">More from CellTrack</h2>
      </div>
      <div id="more-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>
  </section>

  <!-- CONTACT BAND -->
  <section class="py-16 px-6 bg-[#F0F7FF]">
    <div class="max-w-2xl mx-auto text-center">
      <h2 class="text-2xl md:text-3xl font-bold text-[#1B3A6B] mb-4">Let's Talk</h2>
      <p class="text-slate-600 mb-8 leading-relaxed">
        Whether you're a pharma company, CDMO, or investor — we'd love to connect.
      </p>
      <a href="mailto:contact@celltrackbio.com"
         class="inline-block bg-[#1B3A6B] text-white font-semibold px-8 py-3.5 rounded-lg hover:bg-[#29ABE2] transition-colors shadow-md">
        Get in Touch
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="py-8 px-6 bg-[#F8FAFC] border-t border-slate-100">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <a href="./"><img src="logo.png" alt="CellTrack" class="h-7" /></a>
      <p class="text-slate-400 text-sm">© 2026 CellTrack. All rights reserved.</p>
      <p class="text-slate-400 text-sm">Madison, Wisconsin</p>
    </div>
  </footer>

  <!-- posts.js is fetched fresh on every visit: the host caches .js files for days, which would hide new posts -->
  <script>document.write('<script src="posts.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="blog.js?v=3"></script>
  <script>
    (function () {
      const slug = new URLSearchParams(location.search).get('p');
      const post = CT.posts.find(p => p.slug === slug);
      const el = document.getElementById('post');
      if (CT.preview) document.getElementById('back').href = 'blog.html?preview';

      if (!post) {
        el.innerHTML = `
          <div class="text-center py-10">
            <h1 class="text-3xl font-extrabold text-[#1B3A6B] mb-4">Post not found</h1>
            <p class="text-slate-500 mb-8">This post may have been moved or removed.</p>
            <a href="blog.html" class="inline-block bg-[#1B3A6B] text-white font-semibold px-6 py-3 rounded-lg hover:bg-[#29ABE2] transition-colors">See all posts</a>
          </div>`;
        return;
      }

      document.title = post.title + ' | CellTrack';
      document.querySelector('meta[name="description"]').setAttribute('content', post.summary || '');
      el.innerHTML = CT.article(post);
      el.querySelectorAll('.post-body a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });

      // Up to 3 other posts, same tag first
      const others = CT.posts.filter(p => p !== post)
        .sort((a, b) => (b.tag === post.tag) - (a.tag === post.tag)).slice(0, 3);
      if (others.length) {
        document.getElementById('more-list').innerHTML = others.map((p, i) => CT.card(p, i)).join('');
        document.getElementById('more').classList.remove('hidden');
        const observer = new IntersectionObserver(entries => entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
        }), { threshold: 0.12 });
        document.querySelectorAll('#more-list .reveal').forEach(x => observer.observe(x));
      }
    })();
  </script>
</body>
</html>
