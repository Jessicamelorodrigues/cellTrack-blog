# Netlify: every push (including posts saved from /admin/) rebuilds posts.js and publishes the site.
[build]
  publish = "."
  command = "node scripts/build-posts.js"

# The admin panel should never be indexed or framed by other sites
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
