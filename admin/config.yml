# Decap CMS — the blog admin panel at /admin/
# Docs: https://decapcms.org/docs/configuration-options/

# ---------------------------------------------------------------------
# LOGIN (DecapBridge: e-mail + password, invite people by e-mail).
# After creating the site at https://decapbridge.com, replace this whole
# backend block with the one DecapBridge shows you (same keys, real values).
# ---------------------------------------------------------------------
backend:
  name: git-gateway
  repo: Jessicamelorodrigues/cellTrack-blog
  branch: main
  identity_url: https://auth.decapbridge.com/sites/COLE-AQUI-O-ID-DO-SITE
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Blog: novo post "{{slug}}"'
    update: 'Blog: atualiza "{{slug}}"'
    delete: 'Blog: exclui "{{slug}}"'
    uploadMedia: 'Blog: imagem "{{path}}"'
    deleteMedia: 'Blog: remove imagem "{{path}}"'

locale: pt
site_url: https://celltrackbio.com
display_url: https://celltrackbio.com/blog.html
logo_url: /logo.png

# Images uploaded in the panel go to blog-images/ and are saved as "blog-images/<file>"
media_folder: blog-images
public_folder: blog-images

collections:
  - name: posts
    label: Posts do blog
    label_singular: Post
    description: Cada post aparece no blog e, se estiver entre os 3 mais recentes, na página inicial.
    folder: content/posts
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{date | date('DD/MM/YYYY')}}{{draft | ternary(' · RASCUNHO', '')}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Publicados
        field: draft
        pattern: false
      - label: Rascunhos
        field: draft
        pattern: true
    fields:
      - { label: Título, name: title, widget: string }
      - label: Resumo
        name: summary
        widget: text
        required: false
        hint: 1–2 frases. Aparece nos cards do blog e no Google (ideal até 160 caracteres).
      - label: Data
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - label: Categoria
        name: tag
        widget: select
        required: false
        options: [Publication, Funding, Recognition, Science, Event, Partnership]
      - { label: Autor, name: author, widget: string, required: false, default: CellTrack Team }
      - label: Imagem de capa
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: Opcional. Use imagens com até ~1600px de largura para o site ficar leve.
      - label: Link externo
        name: link
        widget: string
        required: false
        hint: Opcional (matéria, artigo, paper). Mostra o botão "Read the original" no fim do post.
        pattern: ['^$|^https?://', 'Comece com https://']
      - label: Rascunho
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Ligado = não aparece no site. Desligue para publicar.
      - label: Texto
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]
